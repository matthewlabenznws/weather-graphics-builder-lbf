name: Update METAR Observations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-graphics-builder-updates
  cancel-in-progress: false

jobs:
  update-metar:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas


      # ======================================================
      # UPDATE METARS
      # ======================================================

      - name: Update METAR observations
        run: |
          python update_metar.py


      # ======================================================
      # VERIFY OUTPUT
      # ======================================================

      - name: Verify METAR output
        run: |
          echo "Generated METAR file:"
          ls -lh data/metars.geojson


      # ======================================================
      # CHECK FOR CHANGES
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git add data/metars.geojson

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No METAR changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "METAR observations changed."
          fi


      # ======================================================
      # COMMIT / REBASE / PUSH
      # ======================================================

      - name: Commit updated METAR observations
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "METAR Bot"
          git config user.email "actions@github.com"

          echo "Creating METAR update commit..."
          git commit -m "Update METAR observations"

          echo "Fetching latest main branch..."
          git fetch origin main

          echo "Rebasing METAR update onto latest main..."
          git rebase origin/main

          echo "Pushing updated METAR observations..."
          git push origin HEAD:main

          echo "METAR update complete."
