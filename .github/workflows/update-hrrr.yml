name: Update HRRR ReflUH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-hrrr:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            herbie-data \
            cfgrib \
            eccodes \
            cartopy \
            scipy \
            matplotlib \
            numpy \
            boto3


      # ======================================================
      # CONFIGURE AWS
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2


      # ======================================================
      # RUN PROGRESSIVE HRRR UPDATE
      #
      # Python itself now handles:
      #
      # - PNG creation
      # - per-hour S3 upload
      # - manifest updates
      # - old frame cleanup
      # ======================================================

      - name: Generate and publish HRRR ReflUH
        run: |
          python update_hrrr_refluh.py


      # ======================================================
      # COMPLETE
      # ======================================================

      - name: Complete
        run: |
          echo "HRRR ReflUH progressive update finished."
