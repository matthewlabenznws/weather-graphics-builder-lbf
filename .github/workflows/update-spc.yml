name: Update SPC Outlooks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-graphics-builder-updates
  cancel-in-progress: false

jobs:
  update-spc:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALL PYTHON PACKAGES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geopandas pyogrio shapely


      # ======================================================
      # RUN SPC UPDATE SCRIPT
      # ======================================================

      - name: Update SPC Day 1 Day 2 Day 3 outlooks
        run: |
          python update_spc.py


      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Show SPC files
        run: |
          echo "Files in data directory:"
          ls -lh data/

          echo ""
          echo "SPC outlook files:"
          ls -lh data/spc_day*.geojson || true


      # ======================================================
      # CHECK WHETHER ANY SPC GEOJSON CHANGED
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git add data/spc_day1_cat.geojson
          git add data/spc_day2_cat.geojson
          git add data/spc_day3_cat.geojson

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SPC outlook changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New SPC outlook changes detected."
          fi


      # ======================================================
      # COMMIT NEW SPC GEOJSON
      # ======================================================

      - name: Commit updated SPC outlooks
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "SPC Outlook Bot"
          git config user.email "actions@github.com"

          git commit -m "Update SPC Day 1 Day 2 Day 3 outlooks"

          echo "Fetching latest main branch..."
          git fetch origin main

          echo "Rebasing SPC update onto latest main..."
          git rebase origin/main

          echo "Pushing updated SPC outlooks..."
          git push origin HEAD:main
