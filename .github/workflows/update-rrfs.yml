name: Update RRFS ReflUH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-rrfs:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALL SYSTEM DEPENDENCIES
      #
      # eccodes/libeccodes helps cfgrib read GRIB2 files.
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev


      # ======================================================
      # INSTALL PYTHON DEPENDENCIES
      #
      # These are the dependencies for update_rrfs_refluh.py
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            boto3 \
            requests \
            xarray \
            cfgrib \
            eccodes \
            numpy \
            scipy \
            matplotlib \
            cartopy


      # ======================================================
      # CONFIGURE AWS CREDENTIALS
      #
      # Uses the same GitHub repository secrets that you
      # already created for HRRR.
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2


      # ======================================================
      # RUN RRFS GENERATOR
      #
      # Python handles:
      #
      # - finding latest RRFS run
      # - downloading REFC
      # - downloading 2-5 km UH
      # - generating PNGs
      # - progressive S3 uploads
      # - progressive manifest updates
      # ======================================================

      - name: Generate and publish RRFS ReflUH
        run: |
          python update_rrfs_refluh.py


      # ======================================================
      # COMPLETE
      # ======================================================

      - name: Complete
        run: |
          echo "RRFS ReflUH progressive update finished."
