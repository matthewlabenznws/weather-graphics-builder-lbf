name: Update WPC ERO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-graphics-builder-updates
  cancel-in-progress: false

jobs:
  update-wpc:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALL PYTHON PACKAGES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ======================================================
      # RUN WPC ERO UPDATE SCRIPT
      # ======================================================

      - name: Update WPC Day 1 Day 2 Day 3 ERO
        run: |
          python update_wpc.py


      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Show WPC files
        run: |
          echo "Files in data directory:"
          ls -lh data/

          echo ""
          echo "WPC ERO files:"
          ls -lh data/wpc_day*_ero.geojson || true


      # ======================================================
      # STAGE WPC GEOJSON FILES
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git add data/wpc_day1_ero.geojson
          git add data/wpc_day2_ero.geojson
          git add data/wpc_day3_ero.geojson

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No WPC ERO changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New WPC ERO changes detected."
          fi


      # ======================================================
      # COMMIT UPDATED WPC GEOJSON
      # ======================================================

      - name: Commit updated WPC ERO
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "WPC ERO Bot"
          git config user.email "actions@github.com"

          echo "Creating WPC ERO update commit..."
          git commit -m "Update WPC Day 1 Day 2 Day 3 ERO"

          echo ""
          echo "Attempting to push WPC ERO update..."

          for attempt in 1 2 3 4 5
          do
            echo ""
            echo "=========================================="
            echo "Push attempt $attempt of 5"
            echo "=========================================="

            echo "Fetching latest main..."
            git fetch origin main

            echo "Rebasing onto latest main..."
            git rebase origin/main

            echo "Attempting push..."

            if git push origin HEAD:main; then
              echo ""
              echo "WPC ERO update pushed successfully."
              exit 0
            fi

            echo ""
            echo "Push failed because main changed."

            if [ "$attempt" -lt 5 ]; then
              echo "Another workflow likely pushed to main."
              echo "Waiting 5 seconds before trying again..."
              sleep 5
            fi
          done

          echo ""
          echo "WPC ERO update failed after 5 push attempts."
          exit 1
