<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NWS North Platte Weather Graphics</title>


    <!-- =====================================================
         MAPBOX CSS
         ===================================================== -->

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         SITE CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         MAP
         ===================================================== -->

    <div id="map"></div>

    <div id="graphics-credit">
    Graphics created by: Matthew Labenz
    </div>
    
    <!-- =====================================================
         OVERLAYS MENU
         ===================================================== -->

    <div id="overlay-menu">

        <button id="overlay-menu-button">
            Overlays ▼
        </button>


        <div id="overlay-menu-content">


            <!-- =============================================
                 SPC
                 ============================================= -->

            <div class="overlay-section-title">
                SPC
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-toggle"
                    checked
                >

                <span>
                    Day 1 Outlook
                </span>

            </label>


            <!-- =============================================
                 NWS
                 ============================================= -->

            <div class="overlay-section-title">
                NWS
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="cwa-toggle"
                    checked
                >

                <span>
                    LBF CWA
                </span>

            </label>


            <!-- =============================================
                 BOUNDARIES
                 ============================================= -->

            <div class="overlay-section-title">
                Boundaries
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="county-toggle"
                    checked
                >

                <span>
                    Counties
                </span>

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="state-toggle"
                    checked
                >

                <span>
                    State Borders
                </span>

            </label>


        </div>

    </div>


    <!-- =====================================================
         MODEL VALID TIME
         ===================================================== -->

    <div
        id="model-valid-label"
        class="model-ui"
    >

        Loading HRRR...

    </div>


    <!-- =====================================================
         NWS NORTH PLATTE BRANDING
         ===================================================== -->

    <div id="office-branding">

        <img
            id="office-logo"
            src="assets/NOAANWSLogos.png"
            alt="NOAA and National Weather Service logos"
        >


        <div id="office-name">
            NWS North Platte, NE
        </div>


        <!-- ================================================
             MODEL / PRODUCT CONTROLS
             ================================================ -->

        <div id="model-product-controls">


            <select id="model-select">

                <option value="hrrr">
                    HRRR
                </option>

                <option
                    value="rrfs"
                >
                    RRFS
                </option>

                <option value="none">
                    Overlays Only
                </option>

            </select>


            <select id="product-select">

                <option value="reflUH">
                    Reflectivity + UH ≥ 75
                </option>

            </select>


        </div>

    </div>


    <!-- =====================================================
         MODEL TIMELINE
         ===================================================== -->

    <div
        id="model-timeline"
        class="model-ui"
    >


        <!-- PLAY -->

        <button
            id="model-play-button"
            class="timeline-control-button"
            title="Play"
        >
            ▶
        </button>


        <!-- PREVIOUS -->

        <button
            id="model-prev-button"
            class="timeline-control-button"
            title="Previous hour"
        >
            ‹
        </button>


        <!-- FORECAST HOURS -->

        <div id="model-hour-list"></div>


        <!-- NEXT -->

        <button
            id="model-next-button"
            class="timeline-control-button"
            title="Next hour"
        >
            ›
        </button>


    </div>


    <!-- =====================================================
         MAPBOX JS
         ===================================================== -->

    <script
        src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js">
    </script>


    <!-- =====================================================
         SITE JS
         ===================================================== -->

    <script src="graphics.js"></script>


</body>

</html>
