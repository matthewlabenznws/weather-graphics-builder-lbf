<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NWS North Platte Weather Graphics</title>


    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         SINGLE MODEL MAP
         ===================================================== -->

    <div
        id="single-map"
        class="map-panel"
    ></div>


    <!-- =====================================================
         COMPARISON MAPS
         ===================================================== -->

    <div
        id="comparison-container"
        class="hidden"
    >

        <div class="compare-panel">

            <div
                id="left-map"
                class="compare-map"
            ></div>


            <div class="compare-panel-label">

                <div class="compare-model-name">
                    HRRR
                </div>

                <div class="compare-product-name">
                    Reflectivity + UH ≥ 75
                </div>

            </div>

        </div>


        <div class="compare-divider"></div>


        <div class="compare-panel">

            <div
                id="right-map"
                class="compare-map"
            ></div>


            <div class="compare-panel-label">

                <div class="compare-model-name">
                    RRFS
                </div>

                <div class="compare-product-name">
                    Reflectivity + UH ≥ 75
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         OVERLAYS
         ===================================================== -->

    <div id="overlay-menu">


        <button id="overlay-menu-button">

            Overlays ▼

        </button>


        <div id="overlay-menu-content">


            <!-- =================================================
                 SPC SEVERE
                 ================================================= -->

            <div class="overlay-section-title">
                SPC Severe Outlooks
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-day1-toggle"
                    checked
                >

                Day 1 Categorical

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-day2-toggle"
                >

                Day 2 Categorical

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-day3-toggle"
                >

                Day 3 Categorical

            </label>


            <!-- =================================================
                 SPC FIRE WEATHER
                 ================================================= -->

            <div class="overlay-section-title">
                SPC Fire Weather
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="fire-day1-toggle"
                >

                Day 1 Fire Weather

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="fire-day2-toggle"
                >

                Day 2 Fire Weather

            </label>


            <!-- =================================================
                 WPC EXCESSIVE RAINFALL
                 ================================================= -->

            <div class="overlay-section-title">
                WPC Excessive Rainfall
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="wpc-day1-toggle"
                >

                Day 1 ERO

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="wpc-day2-toggle"
                >

                Day 2 ERO

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="wpc-day3-toggle"
                >

                Day 3 ERO

            </label>


            <!-- =================================================
                 NWS HAZARDS
                 ================================================= -->

            <div class="overlay-section-title">
                NWS Hazards
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-all-toggle"
                >

                All Hazards

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-severe-toggle"
                >

                Severe Warnings

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-watches-toggle"
                >

                Severe Watches

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-flood-toggle"
                >

                Flood Headlines

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-fire-toggle"
                >

                Fire Weather Headlines

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-heat-toggle"
                >

                Heat Headlines

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="nws-winter-toggle"
                >

                Winter Headlines

            </label>


            <!-- =================================================
                 NWS
                 ================================================= -->

            <div class="overlay-section-title">
                NWS
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="cwa-toggle"
                    checked
                >

                LBF CWA

            </label>


            <!-- =================================================
                 BOUNDARIES
                 ================================================= -->

            <div class="overlay-section-title">
                Boundaries
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="county-toggle"
                    checked
                >

                Counties

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="state-toggle"
                    checked
                >

                State Borders

            </label>


        </div>

    </div>


    <!-- =====================================================
         VALID TIME
         ===================================================== -->

    <div
        id="model-valid-label"
        class="model-ui"
    >

        Loading model...

    </div>


    <!-- =====================================================
         OFFICE BRANDING
         ===================================================== -->

    <div id="office-branding">


        <img
            id="office-logo"
            src="assets/NOAANWSLogos.png"
            alt="NOAA and National Weather Service logos"
        >


        <div id="office-name">

            NWS North Platte, NE

        </div>


        <div id="viewer-controls">


            <select id="viewer-mode-select">

                <option value="single">
                    Single Model
                </option>

                <option value="compare">
                    Compare Models
                </option>

                <option value="overlays">
                    Overlays Only
                </option>

            </select>


            <select id="model-select">

                <option value="hrrr">
                    HRRR
                </option>

                <option value="rrfs">
                    RRFS
                </option>

            </select>


            <select id="product-select">

                <option value="reflUH">
                    Reflectivity + UH ≥ 75
                </option>

            </select>


        </div>

    </div>


    <!-- =====================================================
         GRAPHICS CREDIT
         ===================================================== -->

    <div id="graphics-credit">

        Graphics created by: Matthew Labenz

    </div>


    <!-- =====================================================
         MODEL TIMELINE
         ===================================================== -->

    <div
        id="model-timeline"
        class="model-ui"
    >


        <button
            id="model-play-button"
            class="timeline-control-button"
            title="Play"
        >
            ▶
        </button>


        <button
            id="model-prev-button"
            class="timeline-control-button"
            title="Previous hour"
        >
            ‹
        </button>


        <div id="model-hour-list"></div>


        <button
            id="model-next-button"
            class="timeline-control-button"
            title="Next hour"
        >
            ›
        </button>


    </div>


    <!-- =====================================================
         MAPBOX
         ===================================================== -->

    <script
        src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"
    ></script>


    <!-- =====================================================
         GRAPHICS
         ===================================================== -->

    <script src="graphics.js"></script>


</body>

</html>
