<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NWS North Platte Weather Graphics</title>


    <!-- =====================================================
         MAPBOX
         ===================================================== -->

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         SITE CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         SINGLE MODEL MAP
         ===================================================== -->

    <div
        id="single-map"
        class="map-panel"
    ></div>


    <!-- =====================================================
         COMPARISON MAPS
         ===================================================== -->

    <div
        id="comparison-container"
        class="hidden"
    >

        <!-- =================================================
             LEFT PANEL — HRRR
             ================================================= -->

        <div class="compare-panel">

            <div
                id="left-map"
                class="compare-map"
            ></div>


            <div class="compare-panel-label">

                <div class="compare-model-name">
                    HRRR
                </div>

                <div class="compare-product-name">
                    Reflectivity + UH ≥ 75
                </div>

            </div>

        </div>


        <!-- =================================================
             CENTER DIVIDER
             ================================================= -->

        <div class="compare-divider"></div>


        <!-- =================================================
             RIGHT PANEL — RRFS
             ================================================= -->

        <div class="compare-panel">

            <div
                id="right-map"
                class="compare-map"
            ></div>


            <div class="compare-panel-label">

                <div class="compare-model-name">
                    RRFS
                </div>

                <div class="compare-product-name">
                    Reflectivity + UH ≥ 75
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         OVERLAYS MENU
         ===================================================== -->

    <div id="overlay-menu">


        <!-- =================================================
             OVERLAYS BUTTON
             ================================================= -->

        <button id="overlay-menu-button">

            Overlays ▼

        </button>


        <!-- =================================================
             OVERLAYS DROPDOWN
             ================================================= -->

        <div id="overlay-menu-content">


            <!-- =================================================
                 SPC OUTLOOKS
                 ================================================= -->

            <div class="overlay-section-title">
                SPC Outlooks
            </div>


            <!-- DAY 1 -->

            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-day1-toggle"
                    checked
                >

                Day 1 Outlook

            </label>


            <!-- DAY 2 -->

            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-day2-toggle"
                >

                Day 2 Outlook

            </label>


            <!-- DAY 3 -->

            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="spc-day3-toggle"
                >

                Day 3 Outlook

            </label>


            <!-- =================================================
                 NWS
                 ================================================= -->

            <div class="overlay-section-title">
                NWS
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="cwa-toggle"
                    checked
                >

                LBF CWA

            </label>


            <!-- =================================================
                 BOUNDARIES
                 ================================================= -->

            <div class="overlay-section-title">
                Boundaries
            </div>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="county-toggle"
                    checked
                >

                Counties

            </label>


            <label class="overlay-row">

                <input
                    type="checkbox"
                    id="state-toggle"
                    checked
                >

                State Borders

            </label>


        </div>

    </div>


    <!-- =====================================================
         VALID TIME
         ===================================================== -->

    <div
        id="model-valid-label"
        class="model-ui"
    >

        Loading model...

    </div>


    <!-- =====================================================
         OFFICE BRANDING
         ===================================================== -->

    <div id="office-branding">


        <!-- =================================================
             NOAA / NWS LOGOS
             ================================================= -->

        <img
            id="office-logo"
            src="assets/NOAANWSLogos.png"
            alt="NOAA and National Weather Service logos"
        >


        <!-- =================================================
             OFFICE NAME
             ================================================= -->

        <div id="office-name">

            NWS North Platte, NE

        </div>


        <!-- =================================================
             VIEWER CONTROLS
             ================================================= -->

        <div id="viewer-controls">


            <!-- =================================================
                 VIEW TYPE
                 ================================================= -->

            <select id="viewer-mode-select">

                <option value="single">

                    Single Model

                </option>


                <option value="compare">

                    Compare Models

                </option>


                <option value="overlays">

                    Overlays Only

                </option>

            </select>


            <!-- =================================================
                 MODEL
                 ================================================= -->

            <select id="model-select">

                <option value="hrrr">

                    HRRR

                </option>


                <option value="rrfs">

                    RRFS

                </option>

            </select>


            <!-- =================================================
                 PRODUCT
                 ================================================= -->

            <select id="product-select">

                <option value="reflUH">

                    Reflectivity + UH ≥ 75

                </option>

            </select>


        </div>

    </div>


    <!-- =====================================================
         GRAPHICS CREDIT
         ===================================================== -->

    <div id="graphics-credit">

        Graphics created by: Matthew Labenz

    </div>


    <!-- =====================================================
         MODEL TIMELINE
         ===================================================== -->

    <div
        id="model-timeline"
        class="model-ui"
    >


        <!-- =================================================
             PLAY / PAUSE
             ================================================= -->

        <button
            id="model-play-button"
            class="timeline-control-button"
            title="Play"
        >

            ▶

        </button>


        <!-- =================================================
             PREVIOUS HOUR
             ================================================= -->

        <button
            id="model-prev-button"
            class="timeline-control-button"
            title="Previous hour"
        >

            ‹

        </button>


        <!-- =================================================
             FORECAST HOURS
             ================================================= -->

        <div id="model-hour-list"></div>


        <!-- =================================================
             NEXT HOUR
             ================================================= -->

        <button
            id="model-next-button"
            class="timeline-control-button"
            title="Next hour"
        >

            ›

        </button>


    </div>


    <!-- =====================================================
         MAPBOX JS
         ===================================================== -->

    <script
        src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"
    ></script>


    <!-- =====================================================
         GRAPHICS VIEWER JS
         ===================================================== -->

    <script src="graphics.js"></script>


</body>

</html>
